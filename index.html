<html lang="en">

    <script>
      (function() {
        // Intercept uncaught fetch error event as early as possible
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          var str = String(msg || (err && err.message) || '');
          if (str.indexOf('fetch') !== -1 && str.indexOf('getter') !== -1) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
        };

        // Provide setter for window.fetch so assignments (e.g. window.fetch = fn) don't throw
        try {
          var currentFetch = window.fetch;
          var patchTarget = function(target) {
            if (!target) return false;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
              return true;
            } catch(e) {
              return false;
            }
          };

          patchTarget(window);
          try { patchTarget(Object.getPrototypeOf(window)); } catch(e) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try { patchTarget(Window.prototype); } catch(e) {}
          }
        } catch(e) {}
      })();
    </script>
